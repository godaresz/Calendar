<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ตารางเวรตรวจแก้ว / ภาชนะน้ำดื่ม (ตรวจน้ำกระท่อม)</title>
<style>
:root{--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f1f5f9;--violet:#7C3AED;--red:#EF4444}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,"Noto Sans Thai",sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:1300px;margin:0 auto;padding:16px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.nbtn{display:flex;align-items:center;gap:7px;border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px 6px 7px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;color:var(--ink)}
.nbtn .dot{width:14px;height:14px;border-radius:50%;flex:none}
.nbtn small{font-weight:600;color:var(--muted);font-size:10px}
.nbtn.on{border-color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.nbtn.all .dot{background:linear-gradient(135deg,#059669,#2563EB,#DC2626)}
button.g{background:#1E3A8A;color:#fff;border:0;border-radius:999px;padding:8px 18px;font-weight:800;cursor:pointer;font-family:inherit;font-size:13px}

.sheet{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.shead{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #1E3A8A;padding-bottom:5px;margin-bottom:6px}
.shead h1{margin:0;font-size:15pt;color:#1E3A8A}
.shead p{margin:2px 0 0;font-size:7.5pt;color:var(--muted)}
.shead .rt{text-align:right;font-size:7.5pt;color:var(--muted)}
.shead .rt b{display:block;font-size:12pt;color:var(--ink)}

.lg{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px}
.lg span.p{display:inline-flex;align-items:center;gap:4px;font-size:7pt;font-weight:700;color:#fff;border-radius:4px;padding:2px 7px}
.lg span.sep{font-size:7pt;font-weight:800;color:var(--muted);padding:2px 2px}

.months{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.mon h3{margin:0 0 3px;font-size:8pt;background:#334155;color:#fff;border-radius:4px;padding:3px 7px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1.5px}
.cal .hd{text-align:center;font-size:6pt;font-weight:800;color:#fff;background:#64748b;border-radius:2px;padding:1.5px 0}
.cal .hd.s0{background:#b91c1c}.cal .hd.s6{background:var(--violet)}
.cell{min-height:46px;border:1px solid var(--line);border-radius:3px;padding:1.5px;background:#fff;overflow:hidden}
.cell.blank{border:0;background:transparent;min-height:0}
.cell.hol{background:#FEE2E2;border-color:#FCA5A5}
.cell.sun{background:#f1f5f9}
.cell.out{background:#f8fafc;border-style:dashed}
.cell.sat{box-shadow:inset 0 0 0 1.5px var(--violet)}
.cell.mine{background:#ecfdf5;border-color:#34d399}
.dnum{font-weight:800;color:#475569;font-size:6.5pt;line-height:1.1}
.cell.hol .dnum{color:var(--red)}
.cell.sun .dnum,.cell.out .dnum{color:#cbd5e1}
.tag{display:block;color:#fff;border-radius:2px;padding:0 2px;font-size:5.6pt;font-weight:700;margin-top:1px;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag i{font-style:normal;background:rgba(255,255,255,.9);color:#1e293b;border-radius:1.5px;padding:0 2px;margin-right:2px;font-size:5pt}
.holtx{font-size:5.5pt;color:#dc2626;font-weight:800}
.foot{display:flex;justify-content:space-between;font-size:6.5pt;color:var(--muted);margin-top:6px;border-top:1px solid var(--line);padding-top:4px}

/* ดูบนมือถือ/แท็บเล็ต: ขยายตัวอักษร ลดคอลัมน์ */
@media screen and (max-width:1000px){
  .months{grid-template-columns:repeat(2,1fr);gap:12px}
}
@media screen and (max-width:640px){
  .wrap{padding:10px}
  .months{grid-template-columns:1fr}
  .shead{flex-direction:column;align-items:flex-start;gap:4px}
  .shead h1{font-size:17px}.shead p,.shead .rt{font-size:11px;text-align:left}
  .lg span.p,.lg span.sep{font-size:11px}
  .mon h3{font-size:14px;padding:6px 10px}
  .cal{gap:3px}.cal .hd{font-size:11px;padding:3px 0}
  .cell{min-height:56px;padding:2px}
  .dnum{font-size:11px}.holtx{font-size:9px}
  .tag{font-size:9px;white-space:normal;overflow:visible;line-height:1.3;padding:1px 2px}.tag i{font-size:8px;display:inline-block}
  .mon div[style]{font-size:12px!important}
  .foot{font-size:10px;flex-direction:column;gap:2px}
}
@page{size:A4 landscape;margin:5mm}
@media print{
  body{background:#fff}
  .wrap{max-width:none;padding:0}
  .bar{display:none}
  .sheet{border:0;border-radius:0;padding:0}
  .shead{padding-bottom:2px;margin-bottom:3px}
  .shead h1{font-size:12pt}
  .lg{margin-bottom:3px;gap:3px}
  .lg span.p{padding:1px 5px;font-size:6.5pt}
  .months{gap:2px 5px}
  .mon h3{font-size:7pt;padding:1.5px 6px;margin-bottom:1.5px}
  .cal{gap:1px}
  .cal .hd{font-size:5.5pt;padding:0}
  .cell{min-height:0;padding:1px 1.5px}
  .cell.sun,.cell.out,.cell.hol{min-height:8mm}
  .dnum{font-size:5.5pt;line-height:1}
  .tag{font-size:5pt;line-height:1.22;margin-top:.5px;padding:0 1.5px}
  .tag i{font-size:4.5pt}
  .mon div[style]{font-size:6.2pt!important;line-height:1.55!important}
  .foot{margin-top:3px;padding-top:2px}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style></head><body>

  <div class="bar" id="bar"></div>

</div>

    });
  });
  h+='</div><div class="months">';

  months.forEach(([y,m])=>{
    h+='<div class="mon"><h3>'+TH_M[m]+' '+y+'</h3><div class="cal">';
    TH_DOW_S.forEach((t,i)=>h+='<div class="hd s'+i+'">'+t+'</div>');
    const first=new Date(y,m,1).getDay(), nd=new Date(y,m+1,0).getDate();
    const hol=DATA.holidays[y+'-'+(m+1)]||[];
    for(let i=0;i<first;i++) h+='<div class="cell blank"></div>';
    for(let d=1;d<=nd;d++){
      const k=y+'-'+pad(m+1)+'-'+pad(d), dt=new Date(y,m,d), s=byDate[k];
      let cls='cell', body='<span class="dnum">'+d+'</span>';
      if(s){
        const ks = sel ? SLOTS.filter(x=>s[x]===sel) : SLOTS;
        if(sel && ks.length) cls+=' mine';
        ks.forEach(x=>{const n=s[x];
          body+='<span class="tag" style="background:'+COL[n]+'"><i>'+x[1]+x[0]+'</i>'+n.split(' ')[0]+'</span>';});
        if(dt.getDay()===6) cls+=' sat';
      } else if(dt.getDay()===0) cls+=' sun';
      else if(hol.includes(d)){ cls+=' hol'; body+='<span class="holtx">หยุด</span>'; }
      else cls+=' out';
      h+='<div class="'+cls+'">'+body+'</div>';
    }
    h+='</div></div>';
  });

  h+='<div class="mon"><h3>หมายเหตุ</h3><div style="font-size:6.8pt;line-height:1.75;color:#334155;padding:2px 4px">'
   + '• ตรวจแก้ว กระติก และภาชนะใส่น้ำดื่มของพนักงานแบบ 100% ทุกใบในพื้นที่ที่รับผิดชอบ<br>'
   + '• <b style="color:#DC2626">ต้องตรวจและส่งข้อมูลให้เสร็จก่อน 15:00 น. ของวันที่มีเวร</b><br>'
   + '• ป้ายในแต่ละวันอ่านว่า WH + กะ เช่น <b>1A</b> = WH1 กะ A, <b>4B</b> = WH4 กะ B<br>'
   + '• ธนัทพร และ วงศ์จันทร์ ดูได้ทั้ง WH1 และ WH4 จึงถูกสลับไปเติมช่องที่ขาดในแต่ละวัน<br>'
   + '• <span style="box-shadow:inset 0 0 0 1.5px #7C3AED;padding:0 4px;border-radius:3px">กรอบม่วง</span> = วันเสาร์ที่เปิดทำงาน &nbsp; '
   + '<span style="background:#FEE2E2;padding:0 4px;border-radius:3px">แดง</span> = วันหยุดบริษัท &nbsp; '
   + '<span style="background:#f1f5f9;padding:0 4px;border-radius:3px">เทา</span> = อาทิตย์ / นอกช่วง<br>'
   + '• จำนวนหลังชื่อในแถบด้านบน = จำนวนวันเวรตลอดช่วง'
   + '</div></div>';

  h+='</div><div class="foot"><span>จัดทำ 10 พ.ย. 2026</span><span>ปฏิทินวันหยุดอ้างอิง IMCT &amp; LINEX เม.ย. 2026 – มี.ค. 2027</span></div>';

  document.getElementById('sheet').innerHTML=h;
}
bar(); render();
</script></body></html>
